name: Validate ArcLive
on:
  push:
    branches: [main, 'fix/**']
    paths-ignore: ['data/**']
  pull_request:
    paths-ignore: ['data/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node tests/frontend.test.cjs
      - run: node tests/worker.test.mjs
      - name: Validate Cloudflare bundle without deployment
        run: npx --yes wrangler@4.102.0 deploy --dry-run
      - name: Install isolated browser test tools
        run: |
          npm install --prefix /tmp/arclive-browser --no-save --ignore-scripts playwright@1.62.1
          /tmp/arclive-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser integration
        env:
          NODE_PATH: /tmp/arclive-browser/node_modules
        run: node tests/browser.test.cjs
