name: Save Shared Admin State

on:
  workflow_dispatch:
    inputs:
      state_b64:
        description: "Base64 encoded JSON state"
        required: true
        default: ""

concurrency:
  group: arclive-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  save-admin-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Decode and save state
        env:
          WF_STATE_B64: ${{ github.event.inputs.state_b64 }}
        run: python scripts/save_admin_state.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update shared admin state"
          git push
