name: Reset Live Competition Data

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "New IANSEO source URL (optional)"
        required: false
        default: ""
      place:
        description: "Competition place label (optional)"
        required: false
        default: ""

concurrency:
  group: arclive-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  reset-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Reset live data
        env:
          WF_SOURCE_URL: ${{ github.event.inputs.source_url }}
          WF_PLACE: ${{ github.event.inputs.place }}
        run: |
          python scripts/reset_live_data.py \
            --output data/live.json \
            --source-url "$WF_SOURCE_URL" \
            --place "$WF_PLACE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "chore(data): reset live competition" || echo "No changes"
          git push
